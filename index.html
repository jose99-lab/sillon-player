<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080b1c">

    <meta name="description"
          content="Sillon Player - Lecteur de musique moderne">

    <title>Sillon Player</title>

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b1c;
            color: white;
            min-height: 100vh;
        }

        .app {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            padding: 25px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: #b14cff;
        }

        .menu {
            font-size: 25px;
        }

        .album {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 25px;
            background: linear-gradient(
                135deg,
                #651fff,
                #ff2bd6
            );
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(128, 50, 255, .35);
            margin-bottom: 30px;
        }

        .album-icon {
            font-size: 100px;
        }

        .song-info {
            margin-bottom: 25px;
        }

        .song-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .artist {
            color: #999;
            font-size: 16px;
        }

        .progress-container {
            margin: 25px 0;
        }

        .progress {
            width: 100%;
            height: 5px;
            background: #292d45;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 35%;
            height: 100%;
            background: linear-gradient(
                90deg,
                #ff3bd4,
                #704cff
            );
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 12px;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 30px 0;
        }

        .control {
            border: none;
            background: transparent;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .play {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 28px;
            background: linear-gradient(
                135deg,
                #b13cff,
                #4b5cff
            );
            box-shadow: 0 10px 30px rgba(105, 60, 255, .5);
            cursor: pointer;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .bottom button {
            background: #12162b;
            border: 1px solid #252a45;
            color: #aaa;
            padding: 14px;
            border-radius: 15px;
            cursor: pointer;
        }

        .volume {
            margin-top: 25px;
        }

        .volume input {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">
            Sillon<span>Player</span>
        </div>

        <div class="menu">⋮</div>
    </header>

    <main>

        <div class="album">
            <div class="album-icon">🎵</div>
        </div>

        <div class="song-info">
            <div class="song-title">
                Ma chanson
            </div>

            <div class="artist">
                Artiste inconnu
            </div>
        </div>

        <div class="progress-container">

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <div class="time">
                <span>01:24</span>
                <span>03:35</span>
            </div>

        </div>

        <div class="controls">

            <button class="control">
                🔀
            </button>

            <button class="control">
                ⏮
            </button>

            <button class="play">
                ▶
            </button>

            <button class="control">
                ⏭
            </button>

            <button class="control">
                🔁
            </button>

        </div>

        <div class="volume">
            🔊
            <input
                type="range"
                min="0"
                max="100"
                value="70">
        </div>

        <div class="bottom">
            <button>♡ Favoris</button>
            <button>☷ Playlist</button>
            <button>☰ Musiques</button>
        </div>

    </main>

</div>

<script>
    // Service Worker
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js")
            .then(() => {
                console.log("Service Worker activé");
            })
            .catch(error => {
                console.log("Erreur :", error);
            });
    }
</script>

</body>
</html>
