<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="manifest.json">

    <title>RJ Player</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .player {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            color: #9ca3af;
            margin-top: 5px;
        }

        .cover {
            width: 280px;
            height: 280px;
            margin: 10px auto 25px;
            border-radius: 25px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
        }

        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-title {
            font-size: 22px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .artist {
            color: #9ca3af;
            margin-top: 6px;
        }

        .progress-container {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;
            color: #9ca3af;
            font-size: 12px;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 25px 0;
        }

        button {
            border: none;
            cursor: pointer;
            color: white;
            background: transparent;
        }

        .control-btn {
            font-size: 28px;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #6366f1;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .volume span {
            font-size: 22px;
        }

        .file-section {
            margin-top: auto;
        }

        .file-btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: #1f2937;
            color: white;
            font-size: 16px;
            border: 1px solid #374151;
        }

        .playlist {
            margin-top: 20px;
        }

        .playlist h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .song {
            padding: 12px;
            background: #1f2937;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .song.active {
            background: #3730a3;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>

<body>

<div class="player">

    <div class="header">
        <h1>🎵 RJ Player</h1>
        <p>Music Player</p>
    </div>

    <div class="cover">
        🎵
    </div>

    <div class="song-info">
        <div class="song-title" id="songTitle">
            Aucune chanson
        </div>

        <div class="artist" id="artist">
            Sélectionnez vos musiques
        </div>
    </div>

    <div class="progress-container">

        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

    </div>

    <div class="controls">

        <button
            class="control-btn"
            id="prevBtn"
            title="Précédent">
            ⏮
        </button>

        <button
            class="play-btn"
            id="playBtn"
            title="Play">
            ▶
        </button>

        <button
            class="control-btn"
            id="nextBtn"
            title="Suivant">
            ⏭
        </button>

    </div>

    <div class="volume">

        <span>🔊</span>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

    <audio id="audio"></audio>

    <div class="file-section">

        <input
            type="file"
            id="fileInput"
            accept="audio/*"
            multiple
        >

        <button
            class="file-btn"
            id="chooseBtn">
            📂 Ajouter mes musiques
        </button>

        <div class="playlist">

            <h2>Playlist</h2>

            <div id="playlist"></div>

        </div>

    </div>

</div>

<script>

const audio = document.getElementById("audio");

const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const songTitle = document.getElementById("songTitle");
const artist = document.getElementById("artist");

const fileInput = document.getElementById("fileInput");
const chooseBtn = document.getElementById("chooseBtn");

const playlistElement = document.getElementById("playlist");


let songs = [];
let currentIndex = 0;


// -----------------------------
// OUVRIR LES FICHIERS
// -----------------------------

chooseBtn.addEventListener("click", () => {
    fileInput.click();
});


fileInput.addEventListener("change", (event) => {

    const files = Array.from(event.target.files);

    if (files.length === 0) return;

    songs = files;

    currentIndex = 0;

    displayPlaylist();

    loadSong(currentIndex);

});


// -----------------------------
// CHARGER UNE CHANSON
// -----------------------------

function loadSong(index) {

    if (!songs.length) return;

    const file = songs[index];

    const url = URL.createObjectURL(file);

    audio.src = url;

    songTitle.textContent = file.name;

    artist.textContent = "Fichier local";

    progress.value = 0;

    currentTime.textContent = "0:00";

    updatePlaylist();

}


// -----------------------------
// PLAY / PAUSE
// -----------------------------

playBtn.addEventListener("click", () => {

    if (!audio.src) return;

    if (audio.paused) {

        audio.play();

        playBtn.textContent = "⏸";

    } else {

        audio.pause();

        playBtn.textContent = "▶";

    }

});


// -----------------------------
// PREVIOUS
// -----------------------------

prevBtn.addEventListener("click", () => {

    if (!songs.length) return;

    currentIndex--;

    if (currentIndex < 0) {
        currentIndex = songs.length - 1;
    }

    loadSong(currentIndex);

    audio.play();

    playBtn.textContent = "⏸";

});


// -----------------------------
// NEXT
// -----------------------------

nextBtn.addEventListener("click", () => {

    nextSong();

});


function nextSong() {

    if (!songs.length) return;

    currentIndex++;

    if (currentIndex >= songs.length) {
        currentIndex = 0;
    }

    loadSong(currentIndex);

    audio.play();

    playBtn.textContent = "⏸";

}


// -----------------------------
// CHANSON TERMINÉE
// -----------------------------

audio.addEventListener("ended", () => {

    nextSong();

});


// -----------------------------
// PROGRESS BAR
// -----------------------------

audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(audio.duration);

});


audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    const percentage =
        (audio.currentTime / audio.duration) * 100;

    progress.value = percentage;

    currentTime.textContent =
        formatTime(audio.currentTime);

});


progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


// -----------------------------
// VOLUME
// -----------------------------

volume.addEventListener("input", () => {

    audio.volume = volume.value;

});


// -----------------------------
// FORMAT TEMPS
// -----------------------------

function formatTime(seconds) {

    if (isNaN(seconds)) return "0:00";

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return minutes + ":" +
        (secs < 10 ? "0" : "") +
        secs;

}


// -----------------------------
// PLAYLIST
// -----------------------------

function displayPlaylist() {

    playlistElement.innerHTML = "";

    songs.forEach((song, index) => {

        const div =
            document.createElement("div");

        div.className = "song";

        div.textContent = song.name;

        div.addEventListener("click", () => {

            currentIndex = index;

            loadSong(currentIndex);

            audio.play();

            playBtn.textContent = "⏸";

        });

        playlistElement.appendChild(div);

    });

    updatePlaylist();

}


function updatePlaylist() {

    const items =
        playlistElement.querySelectorAll(".song");

    items.forEach((item, index) => {

        if (index === currentIndex) {

            item.classList.add("active");

        } else {

            item.classList.remove("active");

        }

    });

}


// -----------------------------
// SERVICE WORKER
// -----------------------------

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("sw.js")
            .then(() => {
                console.log("Service Worker activé");
            })
            .catch(error => {
                console.log(
                    "Erreur Service Worker:",
                    error
                );
            });

    });

}

</script>

</body>
</html>
