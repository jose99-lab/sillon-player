<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<link rel="manifest" href="manifest.json">

<title>RJ Player</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 15%, #2b155d 0%, transparent 35%),
        linear-gradient(160deg, #080810, #0d0d18 50%, #080810);
    color: white;
    min-height: 100vh;
}

/* APP */

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    padding: 20px;
    padding-bottom: 30px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #a855f7;
}

.menu {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
    color: white;
    font-size: 20px;
}

/* COVER */

.cover-wrapper {
    display: flex;
    justify-content: center;
    margin: 10px 0 28px;
}

.cover {
    width: min(330px, 82vw);
    aspect-ratio: 1;
    border-radius: 30px;

    background:
        radial-gradient(circle at 30% 20%, #d946ef, transparent 30%),
        linear-gradient(135deg, #7c3aed, #c026d3);

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 25px 70px rgba(124,58,237,.35),
        inset 0 0 50px rgba(255,255,255,.08);

    position: relative;
    overflow: hidden;
}

.cover::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    top: -60px;
    right: -50px;
}

.cover::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    bottom: -40px;
    left: -30px;
}

.music-icon {
    font-size: 95px;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.3));
    z-index: 2;
}

/* SONG INFO */

.song-info {
    margin-bottom: 20px;
}

.song-title {
    font-size: 25px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    color: #9ca3af;
    margin-top: 7px;
    font-size: 15px;
}

/* PROGRESS */

.progress-area {
    margin-top: 18px;
}

.progress {
    width: 100%;
    height: 5px;
    appearance: none;
    background: #29293a;
    border-radius: 10px;
    outline: none;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    background: #a855f7;
    border-radius: 50%;
    box-shadow: 0 0 12px #a855f7;
}

.progress::-moz-range-thumb {
    width: 14px;
    height: 14px;
    background: #a855f7;
    border-radius: 50%;
    border: none;
}

.time {
    display: flex;
    justify-content: space-between;
    color: #77778b;
    font-size: 12px;
    margin-top: 8px;
}

/* CONTROLS */

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin: 25px 0;
}

.control {
    border: none;
    background: transparent;
    color: #d4d4dc;
    font-size: 24px;
    cursor: pointer;
    transition: .2s;
}

.control:hover {
    color: white;
    transform: scale(1.12);
}

.play {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;

    background: linear-gradient(
        135deg,
        #7c3aed,
        #c026d3
    );

    color: white;
    font-size: 29px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 12px 35px rgba(168,85,247,.4);

    cursor: pointer;
    transition: .2s;
}

.play:hover {
    transform: scale(1.07);
}

/* EXTRA CONTROLS */

.extra-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 5px 5px 22px;
}

.extra-btn {
    border: none;
    background: transparent;
    color: #858596;
    font-size: 19px;
    cursor: pointer;
}

.extra-btn.active {
    color: #c084fc;
}

/* VOLUME */

.volume-box {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
}

.volume-icon {
    font-size: 18px;
}

.volume {
    flex: 1;
    height: 4px;
    appearance: none;
    background: #29293a;
}

.volume::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    background: #8b5cf6;
    border-radius: 50%;
}

/* ACTION BUTTONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

.action {
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    color: #d5d5df;
    border-radius: 13px;
    padding: 13px 5px;
    cursor: pointer;
    transition: .2s;
}

.action:hover {
    background: rgba(168,85,247,.12);
    border-color: rgba(168,85,247,.3);
}

/* FILE INPUT */

#fileInput {
    display: none;
}

/* PLAYLIST */

.playlist-section {
    margin-top: 15px;
}

.playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.playlist-header h2 {
    font-size: 18px;
}

.count {
    color: #77778b;
    font-size: 13px;
}

.playlist {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.song {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px;

    border-radius: 14px;

    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.05);

    cursor: pointer;
    transition: .2s;
}

.song:hover {
    background: rgba(255,255,255,.07);
}

.song.active {
    background:
        linear-gradient(
            90deg,
            rgba(124,58,237,.22),
            rgba(192,38,211,.08)
        );

    border-color: rgba(168,85,247,.25);
}

.song-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #7c3aed,
        #c026d3
    );

    display: flex;
    align-items: center;
    justify-content: center;
}

.song-name {
    flex: 1;
    overflow: hidden;
}

.song-name strong {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
}

.song-name small {
    color: #77778b;
    font-size: 12px;
}

/* EMPTY */

.empty {
    text-align: center;
    color: #77778b;
    padding: 25px 10px;
    font-size: 14px;
}

/* PLAYING ANIMATION */

.playing .music-icon {
    animation: pulse 1.5s infinite ease-in-out;
}

@keyframes pulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

}

/* MOBILE */

@media(max-width:380px) {

    .app {
        padding: 16px;
    }

    .cover {
        width: 270px;
    }

    .controls {
        gap: 22px;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            RJ<span>Player</span>
        </div>

        <button class="menu">⋮</button>

    </div>


    <!-- COVER -->

    <div class="cover-wrapper">

        <div class="cover" id="cover">

            <div class="music-icon">
                🎵
            </div>

        </div>

    </div>


    <!-- SONG -->

    <div class="song-info">

        <div class="song-title" id="songTitle">
            Ma chanson
        </div>

        <div class="artist" id="artist">
            Sélectionnez une musique
        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

        <input
            type="range"
            class="progress"
            id="progress"
            min="0"
            max="100"
            value="0"
        >

        <div class="time">

            <span id="currentTime">0:00</span>

            <span id="duration">0:00</span>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="control"
            id="prevBtn">
            ⏮
        </button>

        <button
            class="play"
            id="playBtn">
            ▶
        </button>

        <button
            class="control"
            id="nextBtn">
            ⏭
        </button>

    </div>


    <!-- EXTRA -->

    <div class="extra-controls">

        <button
            class="extra-btn"
            id="shuffleBtn">
            🔀
        </button>

        <button
            class="extra-btn"
            id="favoriteBtn">
            ♡
        </button>

        <button
            class="extra-btn"
            id="repeatBtn">
            🔁
        </button>

    </div>


    <!-- VOLUME -->

    <div class="volume-box">

        <span class="volume-icon">🔊</span>

        <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="action"
            id="chooseBtn">
            📂 Musiques
        </button>

        <button
            class="action"
            id="playlistBtn">
            ☷ Playlist
        </button>

        <button
            class="action"
            id="favoriteAction">
            ♡ Favoris
        </button>

    </div>


    <!-- FILE -->

    <input
        type="file"
        id="fileInput"
        accept="audio/*"
        multiple
    >


    <!-- PLAYLIST -->

    <div class="playlist-section">

        <div class="playlist-header">

            <h2>Ma playlist</h2>

            <span
                class="count"
                id="songCount">
                0 chanson
            </span>

        </div>

        <div
            class="playlist"
            id="playlist">

            <div class="empty">
                Ajoutez vos musiques pour commencer 🎵
            </div>

        </div>

    </div>


    <audio id="audio"></audio>

</div>


<script>

const audio = document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const progress =
    document.getElementById("progress");

const volume =
    document.getElementById("volume");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const songTitle =
    document.getElementById("songTitle");

const artist =
    document.getElementById("artist");

const fileInput =
    document.getElementById("fileInput");

const chooseBtn =
    document.getElementById("chooseBtn");

const playlist =
    document.getElementById("playlist");

const songCount =
    document.getElementById("songCount");

const cover =
    document.getElementById("cover");

const shuffleBtn =
    document.getElementById("shuffleBtn");

const repeatBtn =
    document.getElementById("repeatBtn");

const favoriteBtn =
    document.getElementById("favoriteBtn");


let songs = [];

let currentIndex = 0;

let shuffle = false;

let repeat = false;


/* FILES */

chooseBtn.onclick = () => {

    fileInput.click();

};


fileInput.onchange = e => {

    songs = Array.from(e.target.files);

    currentIndex = 0;

    displayPlaylist();

    if (songs.length) {

        loadSong(0);

    }

};


/* LOAD SONG */

function loadSong(index) {

    if (!songs.length) return;

    const file = songs[index];

    audio.src =
        URL.createObjectURL(file);

    songTitle.textContent =
        file.name;

    artist.textContent =
        "Fichier local";

    progress.value = 0;

    currentTime.textContent =
        "0:00";

    updatePlaylist();

}


/* PLAY */

playBtn.onclick = () => {

    if (!audio.src) return;

    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();

    }

};


/* PLAY STATE */

audio.onplay = () => {

    playBtn.textContent = "⏸";

    cover.classList.add("playing");

};


audio.onpause = () => {

    playBtn.textContent = "▶";

    cover.classList.remove("playing");

};


/* NEXT */

nextBtn.onclick = () => {

    nextSong();

};


function nextSong() {

    if (!songs.length) return;

    if (shuffle) {

        currentIndex =
            Math.floor(
                Math.random() * songs.length
            );

    } else {

        currentIndex++;

        if (currentIndex >= songs.length) {

            currentIndex = 0;

        }

    }

    loadSong(currentIndex);

    audio.play();

}


/* PREVIOUS */

prevBtn.onclick = () => {

    if (!songs.length) return;

    currentIndex--;

    if (currentIndex < 0) {

        currentIndex =
            songs.length - 1;

    }

    loadSong(currentIndex);

    audio.play();

};


/* END */

audio.onended = () => {

    if (repeat) {

        audio.currentTime = 0;

        audio.play();

    } else {

        nextSong();

    }

};


/* PROGRESS */

audio.ontimeupdate = () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    currentTime.textContent =
        formatTime(audio.currentTime);

};


audio.onloadedmetadata = () => {

    duration.textContent =
        formatTime(audio.duration);

};


progress.oninput = () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100)
        * audio.duration;

};


/* VOLUME */

volume.oninput = () => {

    audio.volume = volume.value;

};


/* SHUFFLE */

shuffleBtn.onclick = () => {

    shuffle = !shuffle;

    shuffleBtn.classList.toggle(
        "active",
        shuffle
    );

};


/* REPEAT */

repeatBtn.onclick = () => {

    repeat = !repeat;

    repeatBtn.classList.toggle(
        "active",
        repeat
    );

};


/* FAVORITE */

favoriteBtn.onclick = () => {

    favoriteBtn.classList.toggle(
        "active"
    );

    favoriteBtn.textContent =
        favoriteBtn.classList.contains("active")
        ? "♥"
        : "♡";

};


/* PLAYLIST */

function displayPlaylist() {

    playlist.innerHTML = "";

    songCount.textContent =
        songs.length +
        (songs.length > 1
        ? " chansons"
        : " chanson");

    songs.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.className = "song";

        item.innerHTML = `

            <div class="song-icon">
                🎵
            </div>

            <div class="song-name">

                <strong>
                    ${escapeHTML(song.name)}
                </strong>

                <small>
                    Fichier local
                </small>

            </div>

            <span>
                ${index + 1}
            </span>

        `;

        item.onclick = () => {

            currentIndex = index;

            loadSong(index);

            audio.play();

        };

        playlist.appendChild(item);

    });

    updatePlaylist();

}


/* ACTIVE SONG */

function updatePlaylist() {

    const items =
        playlist.querySelectorAll(".song");

    items.forEach((item, index) => {

        item.classList.toggle(
            "active",
            index === currentIndex
        );

    });

}


/* TIME */

function formatTime(seconds) {

    if (isNaN(seconds)) return "0:00";

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60);

    return min + ":" +
        (sec < 10 ? "0" : "") +
        sec;

}


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
